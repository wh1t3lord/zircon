<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr6" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">undo/redo that never forgets</text>
  <text x="550" y="64" text-anchor="middle" font-size="13" fill="#64748b">an append-only journal with snapshots — the opposite of a ten-command ring buffer</text>

  <!-- commands stream -->
  <rect x="60" y="96" width="300" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="86" y="126" font-size="14.5" font-weight="600" fill="#3730a3">editor commands</text>
  <text x="86" y="150" font-size="11.5" fill="#4f46e5">create/delete entity, add/remove</text>
  <text x="86" y="168" font-size="11.5" fill="#4f46e5">component, edit fields, gizmo drags…</text>
  <text x="86" y="192" font-size="11" fill="#6366f1">each records only its delta —</text>
  <text x="86" y="208" font-size="11" fill="#6366f1">never a full state copy</text>

  <!-- journal -->
  <rect x="420" y="96" width="620" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="446" y="126" font-size="14.5" font-weight="600" fill="#1d4ed8">journal — append-only, on disk</text>
  <g>
    <rect x="446" y="142" width="100" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="496" y="166" text-anchor="middle" font-size="10.5" fill="#1e3a8a">block</text>
    <rect x="554" y="142" width="100" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="604" y="166" text-anchor="middle" font-size="10.5" fill="#1e3a8a">block</text>
    <rect x="662" y="142" width="100" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="712" y="166" text-anchor="middle" font-size="10.5" fill="#1e3a8a">block</text>
    <rect x="770" y="142" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="4 3"/>
    <text x="820" y="166" text-anchor="middle" font-size="10.5" fill="#1e40af">tail (RAM)</text>
    <text x="890" y="166" font-size="11.5" fill="#1e40af">… zstd-compressed blocks</text>
  </g>
  <text x="446" y="204" font-size="11" fill="#3b82f6">nothing is ever deleted — a new action after undo becomes a branch, not a truncation</text>

  <line x1="360" y1="156" x2="416" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- snapshots -->
  <rect x="420" y="240" width="620" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="446" y="270" font-size="14.5" font-weight="600" fill="#065f46">snapshots — every N commands</text>
  <text x="446" y="294" font-size="11.5" fill="#047857">the full ECS state at that point, zstd-compressed</text>
  <text x="446" y="314" font-size="11.5" fill="#047857">restore = nearest snapshot + replay the journal forward</text>
  <text x="446" y="334" font-size="11.5" fill="#047857">undo inside a snapshot window = apply the recorded inverses backward</text>
  <line x1="700" y1="216" x2="700" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- properties -->
  <rect x="60" y="380" width="300" height="180" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="86" y="410" font-size="14" font-weight="600" fill="#334155">properties</text>
  <text x="86" y="436" font-size="11.5" fill="#475569">• history survives restarts</text>
  <text x="86" y="458" font-size="11.5" fill="#475569">• memory stays bounded (blocks,</text>
  <text x="86" y="476" font-size="11.5" fill="#475569">  small caches, disk spill)</text>
  <text x="86" y="498" font-size="11.5" fill="#475569">• branching instead of truncation</text>
  <text x="86" y="520" font-size="11.5" fill="#475569">• deltas only — one changed field</text>
  <text x="86" y="540" font-size="11.5" fill="#475569">  is one small journal entry</text>

  <!-- proof -->
  <rect x="420" y="380" width="620" height="180" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="446" y="410" font-size="14" font-weight="600" fill="#854d0e">the proof, not the promise</text>
  <text x="446" y="438" font-size="12" fill="#713f12">a randomized 100,000-command stress suite drives every command type:</text>
  <text x="446" y="464" font-size="11.5" fill="#713f12">— every operation recorded (100% journaling coverage)</text>
  <text x="446" y="486" font-size="11.5" fill="#713f12">— undo to the origin restores a byte-identical world</text>
  <text x="446" y="508" font-size="11.5" fill="#713f12">— redo replays to the identical final state</text>
  <text x="446" y="530" font-size="11.5" fill="#713f12">— journal compresses ≥2× and stays within its disk budget</text>
  <text x="446" y="552" font-size="11.5" fill="#713f12">— a journal from a previous run reopens with every command intact</text>
</svg>
