<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="680" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">zircon — the engine, as a replaceable module</text>
  <text x="550" y="64" text-anchor="middle" font-size="13" fill="#64748b">everything below is game.ktk — built from src/, loaded by kotek.exe, replaceable like any module</text>

  <!-- host -->
  <rect x="60" y="90" width="220" height="70" rx="10" fill="#1e3a8a"/>
  <text x="170" y="120" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff">kotek.exe</text>
  <text x="170" y="142" text-anchor="middle" font-size="11.5" fill="#bfdbfe">the launcher (kotek framework)</text>
  <line x1="280" y1="125" x2="336" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="308" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">loads</text>

  <!-- game.ktk container -->
  <rect x="344" y="88" width="700" height="500" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="368" y="116" font-size="15" font-weight="700" fill="#5b21b6">game.ktk — the zircon engine</text>

  <!-- game manager -->
  <rect x="368" y="128" width="320" height="64" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="384" y="153" font-size="13.5" font-weight="600" fill="#5b21b6">game manager</text>
  <text x="384" y="173" font-size="11.5" fill="#6d28d9">orchestration: sessions, renderer, worlds</text>

  <!-- sessions -->
  <rect x="368" y="212" width="320" height="120" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="384" y="237" font-size="13.5" font-weight="600" fill="#5b21b6">sessions</text>
  <rect x="384" y="248" width="136" height="68" rx="7" fill="#eef2ff" stroke="#6366f1"/>
  <text x="452" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730a3">editor session</text>
  <text x="452" y="288" text-anchor="middle" font-size="10" fill="#4f46e5">ImGui tool windows</text>
  <text x="452" y="303" text-anchor="middle" font-size="10" fill="#4f46e5">commands / inspector</text>
  <rect x="536" y="248" width="136" height="68" rx="7" fill="#eef2ff" stroke="#6366f1"/>
  <text x="604" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730a3">game session</text>
  <text x="604" y="288" text-anchor="middle" font-size="10" fill="#4f46e5">the running world</text>
  <text x="604" y="303" text-anchor="middle" font-size="10" fill="#4f46e5">its own render graph</text>

  <!-- ecs -->
  <rect x="368" y="352" width="320" height="96" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="384" y="377" font-size="13.5" font-weight="600" fill="#5b21b6">world + ECS</text>
  <text x="384" y="398" font-size="11.5" fill="#6d28d9">components as dense arrays (pico-ecs backend)</text>
  <text x="384" y="416" font-size="11.5" fill="#6d28d9">factory with codegen'd registration (libclang tool)</text>
  <text x="384" y="434" font-size="11.5" fill="#6d28d9">transform • camera • geometry • bounds • …</text>

  <!-- command history -->
  <rect x="368" y="468" width="320" height="104" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="384" y="493" font-size="13.5" font-weight="600" fill="#5b21b6">undo/redo — full retention</text>
  <text x="384" y="514" font-size="11.5" fill="#6d28d9">append-only journal + snapshots, zstd-compressed</text>
  <text x="384" y="532" font-size="11.5" fill="#6d28d9">history never truncated; branches survive restarts</text>
  <text x="384" y="550" font-size="11.5" fill="#6d28d9">proven by a 100,000-command stress test</text>

  <!-- render -->
  <rect x="712" y="128" width="308" height="180" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="728" y="153" font-size="13.5" font-weight="600" fill="#5b21b6">render — two-project split</text>
  <rect x="728" y="164" width="128" height="56" rx="7" fill="#eff6ff" stroke="#2563eb"/>
  <text x="792" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">executor</text>
  <text x="792" y="202" text-anchor="middle" font-size="9.5" fill="#1e40af">render graph + GPU</text>
  <text x="792" y="214" text-anchor="middle" font-size="9.5" fill="#1e40af">resource managers</text>
  <rect x="876" y="164" width="128" height="56" rx="7" fill="#fefce8" stroke="#ca8a04"/>
  <text x="940" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">passes library</text>
  <text x="940" y="202" text-anchor="middle" font-size="9.5" fill="#713f12">hot-swappable in dev</text>
  <text x="940" y="214" text-anchor="middle" font-size="9.5" fill="#713f12">mode (reload w/o restart)</text>
  <text x="728" y="248" font-size="11.5" fill="#6d28d9">bgfx — rasterization, editor + game passes</text>
  <text x="728" y="266" font-size="11.5" fill="#6d28d9">NRI (DirectX 12) — operational; Vulkan / ray</text>
  <text x="728" y="282" font-size="11.5" fill="#6d28d9">tracing is its designated path</text>
  <text x="728" y="300" font-size="10.5" fill="#94a3b8">per-session pass sets, switchable from the editor</text>

  <!-- resource manager -->
  <rect x="712" y="328" width="308" height="120" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="728" y="353" font-size="13.5" font-weight="600" fill="#5b21b6">resource manager (multithreaded)</text>
  <text x="728" y="374" font-size="11.5" fill="#6d28d9">tiered static caches, bounded queues, worker thread</text>
  <text x="728" y="392" font-size="11.5" fill="#6d28d9">streams file content in 4 KB chunks — big assets</text>
  <text x="728" y="410" font-size="11.5" fill="#6d28d9">never materialize whole in RAM</text>
  <text x="728" y="432" font-size="10.5" fill="#94a3b8">capacities are named preprocessor constants</text>

  <!-- discipline strip -->
  <rect x="712" y="468" width="308" height="104" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="728" y="493" font-size="13.5" font-weight="600" fill="#065f46">the embedded rule, enforced</text>
  <text x="728" y="514" font-size="11.5" fill="#047857">static containers only — a compile-time guard</text>
  <text x="728" y="532" font-size="11.5" fill="#047857">refuses any non-embedded kotek configuration</text>
  <text x="728" y="552" font-size="11.5" fill="#047857">no exceptions • no dynamic containers • streaming</text>

  <!-- connecting lines inside -->
  <line x1="528" y1="192" x2="528" y2="208" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="528" y1="332" x2="528" y2="348" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="528" y1="448" x2="528" y2="464" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="688" y1="160" x2="708" y2="160" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- kotek strip -->
  <rect x="344" y="612" width="700" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="694" y="640" text-anchor="middle" font-size="12.5" fill="#1e40af">built only on kotek interfaces — the framework stays replaceable underneath the engine</text>
  <line x1="694" y1="588" x2="694" y2="608" stroke="#475569" stroke-width="2" marker-end="url(#arr4)"/>
</svg>
