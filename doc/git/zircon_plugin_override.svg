<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">plugin overrides — every module entry is replaceable</text>
  <text x="400" y="44" text-anchor="middle" font-size="11" fill="#64748b">the override-first rule behind KOTEK_INVOKE_MODULE, in every linkage mode: static .lib · implicit .dll · explicit-load .dll</text>

  <!-- the call -->
  <rect x="18" y="64" width="186" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="34" y="86" font-size="11" font-weight="700" fill="#1d4ed8">orchestrator call</text>
  <text x="34" y="104" font-size="9" fill="#3b82f6">KOTEK_INVOKE_MODULE(INIT,</text>
  <text x="34" y="117" font-size="9" fill="#3b82f6">  InitializeModule_Core_Memory,</text>
  <text x="34" y="130" font-size="9" fill="#3b82f6">  p_manager)</text>

  <line x1="204" y1="102" x2="230" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- the override-first lookup -->
  <rect x="234" y="64" width="216" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="250" y="86" font-size="11" font-weight="700" fill="#334155">ktkPluginTryOverride(verb, symbol)</text>
  <text x="250" y="104" font-size="9" fill="#64748b">consults the override registry first:</text>
  <text x="250" y="117" font-size="9" fill="#64748b">plugins/plugins.json (json wins), then</text>
  <text x="250" y="130" font-size="9" fill="#64748b">plugins/&lt;module&gt;.dll by name convention</text>

  <!-- outcome: override -->
  <rect x="490" y="52" width="292" height="58" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="506" y="72" font-size="11" font-weight="700" fill="#854d0e">override found → your dll runs INSTEAD</text>
  <text x="506" y="88" font-size="9" fill="#713f12">its exported InitializeModule_*/ShutdownModule_* (and</text>
  <text x="506" y="101" font-size="9" fill="#713f12">Serialize/Deserialize) replaces the built-in module's</text>
  <line x1="450" y1="90" x2="486" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="455" y="76" font-size="9" fill="#64748b">registered</text>

  <!-- outcome: built-in -->
  <rect x="490" y="124" width="292" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="506" y="144" font-size="11" font-weight="700" fill="#1d4ed8">no override → the built-in path, unchanged</text>
  <text x="506" y="160" font-size="9" fill="#3b82f6">a direct call in static/shared builds; the generated</text>
  <text x="506" y="173" font-size="9" fill="#3b82f6">manifest loader (ktkPluginInvoke*) in PLUGIN builds</text>
  <line x1="450" y1="114" x2="486" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="452" y="140" font-size="9" fill="#64748b">none</text>

  <!-- the footer rules -->
  <rect x="18" y="196" width="764" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="216" text-anchor="middle" font-size="9.5" fill="#64748b">codegen: --kotek_plugins_template → plugins/plugins.template.json · --kotek_plugins_modules → plugins/plugins.modules.json (print + exit 0)</text>
  <text x="400" y="232" text-anchor="middle" font-size="9.5" fill="#64748b">a failed load or a missing exported entry warns and falls back to the built-in · an override dll stays loaded for the process lifetime</text>
</svg>
