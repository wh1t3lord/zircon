name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# the ci-logs publishing step pushes branches — the default
# GITHUB_TOKEN is read-only, so pushes 403 silently without this
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows (${{ matrix.config }}, ${{ matrix.linkage.name }})
    runs-on: windows-2022
    timeout-minutes: 180
    # full dynamic is blocked today by kotek's cyclic module graph (K18):
    # it runs as a visible-but-non-blocking leg until the cycles are broken
    continue-on-error: ${{ matrix.linkage.experimental }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        linkage:
          # owner requirement (2026-07-23): CI compiles all three output
          # configurations of the engine
          - name: default
            flags: ""
            experimental: false
          - name: static
            flags: "-DKOTEK_LINKAGE=STATIC -DKOTEK_DEVELOPMENT_TYPE=STATIC"
            experimental: false
          - name: dynamic
            flags: "-DKOTEK_LINKAGE=SHARED -DKOTEK_DEVELOPMENT_TYPE=SHARED"
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: cache vcpkg
        uses: actions/cache@v4
        with:
          # only the installed triplet tree + the tool itself: packages/ and
          # buildtrees/ are recreatable intermediates and blow the 10 GB
          # cache quota (locally >1.2 GB each); key bumps on the dep list
          path: |
            kotek/vcpkg/installed
            kotek/vcpkg/vcpkg.exe
          key: vcpkg-${{ runner.os }}-x64-windows-static-v2-${{ hashFiles('kotek/cmake/windows/vcpkg_nuget_minimal.cmake') }}
          # a key bump (dep-list change) must NOT mean a cold tree: fall back
          # to the previous generation's tree so only the changed ports
          # rebuild (see the note in tests.yml)
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-v2-

      - name: setup msvc
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: configure
        # retry: vcpkg downloads flake on runners but installs resume cleanly;
        # every attempt is tee'd so the publish step ships the REAL log
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} ${{ matrix.linkage.flags }} *> configure-attempt$attempt.log
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Host "configure attempt $attempt failed, retrying (vcpkg resumes)..."
          }

      - name: build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.config }} --parallel *> build-output.log

      - name: verify outputs
        id: verify
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/${{ matrix.config }}/kotek.exe")) {
            throw "kotek.exe was not produced"
          }
          # full-static links the game module into the exe (no game.ktk)
          if ("${{ matrix.linkage.name }}" -ne "static" -and -not (Test-Path "build/bin/${{ matrix.config }}/game.ktk")) {
            throw "game.ktk was not produced"
          }

      # per-leg badge (shields endpoint json), driven by the real outcome of
      # the leg — $LASTEXITCODE does NOT survive across steps
      - name: emit badge
        if: always()
        shell: pwsh
        run: |
          $ok = "${{ steps.verify.outcome }}" -eq "success"
          @{
            schemaVersion = 1
            label = "build ${{ matrix.config }}-${{ matrix.linkage.name }}"
            message = ($ok ? "passing" : "failing")
            color = ($ok ? "brightgreen" : "red")
          } | ConvertTo-Json -Compress | Out-File -FilePath "build-${{ matrix.config }}-${{ matrix.linkage.name }}.json" -Encoding utf8

      - name: upload badge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badge-${{ matrix.config }}-${{ matrix.linkage.name }}
          path: build-${{ matrix.config }}-${{ matrix.linkage.name }}.json
          retention-days: 1

      # job logs and artifacts need admin rights to view — push the failure
      # logs to a public ci-logs branch instead (same pattern as kotek's
      # workflows)
      - name: publish failure logs to ci-logs branch
        if: failure()
        shell: pwsh
        run: |
          $dest = "ci-logs/${{ github.run_id }}/${{ matrix.config }}-${{ matrix.linkage.name }}"
          New-Item -ItemType Directory -Force $dest | Out-Null
          if (Test-Path configure-attempt1.log) { Copy-Item configure-attempt*.log $dest -Force -ErrorAction SilentlyContinue }
          if (Test-Path build-output.log) { Copy-Item build-output.log $dest -Force -ErrorAction SilentlyContinue }
          cmake -S . -B build-diag -DCMAKE_BUILD_TYPE=${{ matrix.config }} ${{ matrix.linkage.flags }} *> "$dest/diag-configure-output.log"; $null

          # push from a SEPARATE clone: branch switching inside the job's
          # checkout proved too fragile (shallow refspecs, orphan states)
          $tmp = "$env:RUNNER_TEMP/ci-logs-push"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          $repo = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch ci-logs $repo $tmp
          if ($LASTEXITCODE -ne 0) {
            git clone --depth 1 $repo $tmp
            git -C $tmp checkout --orphan ci-logs
            git -C $tmp rm -rf --quiet .
          }
          New-Item -ItemType Directory -Force "$tmp/$dest" | Out-Null
          Copy-Item -Recurse "$dest/*" "$tmp/$dest/" -Force
          git -C $tmp config user.email "ci@zircon"
          git -C $tmp config user.name "zircon-ci"
          git -C $tmp add $dest
          git -C $tmp diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "no new logs to publish"; exit 0 }
          git -C $tmp commit --quiet -m "ci logs: build run ${{ github.run_number }} (${{ matrix.config }}-${{ matrix.linkage.name }})"
          git -C $tmp push origin ci-logs

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.config }}-${{ matrix.linkage.name }}
          path: build/**/*.log
          retention-days: 7

  badges:
    name: publish badges
    runs-on: windows-2022
    needs: [windows]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: collect badges
        uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          path: .
          # without this each artifact lands in its own subdir and the
          # flat *.json copy below stages nothing (silent no-op)
          merge-multiple: true

      # the badges branch may not exist yet (first push) — clone it if it
      # exists, create it as an orphan otherwise, then push the badges
      - name: publish to badges branch
        shell: pwsh
        run: |
          $tmp = "$env:RUNNER_TEMP/badges-push"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          $repo = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch badges $repo $tmp
          if ($LASTEXITCODE -ne 0) {
            git clone --depth 1 --no-checkout $repo $tmp
            git -C $tmp checkout --orphan badges
            git -C $tmp rm -rf --quiet . 2>$null
          }
          Copy-Item *.json "$tmp/" -Force
          git -C $tmp config user.name "zircon-ci"
          git -C $tmp config user.email "ci@zircon.local"
          git -C $tmp add *.json
          git -C $tmp diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            if (-not (Get-ChildItem *.json -ErrorAction SilentlyContinue)) {
              throw "no badge jsons collected (artifact download mismatch) — a silent no-op would hide badge state"
            }
            Write-Host "badges unchanged"; exit 0
          }
          git -C $tmp commit -m "badges: ${{ github.sha }}"
          git -C $tmp push origin badges
