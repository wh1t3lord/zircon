name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# the ci-logs publishing step pushes branches — the default
# GITHUB_TOKEN is read-only, so pushes 403 silently without this
permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (windows, Debug)
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: cache vcpkg
        uses: actions/cache@v4
        with:
          # only the installed triplet tree + the tool itself: packages/ and
          # buildtrees/ are recreatable intermediates and blow the 10 GB
          # cache quota (locally >1.2 GB each); key bumps on the dep list
          path: |
            kotek/vcpkg/installed
            kotek/vcpkg/vcpkg.exe
          key: vcpkg-${{ runner.os }}-x64-windows-static-v2-${{ hashFiles('kotek/cmake/windows/vcpkg_nuget_minimal.cmake') }}
          # a key bump (dep-list change) must NOT mean a cold tree: fall back
          # to the previous generation's tree so only the changed ports
          # rebuild (kotek's tests.yml failed exactly that way on 8670cd7)
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-v2-

      - name: setup msvc
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: configure
        # KOTEK_ASSERT_STDERR_ROUTING=ON is mandatory on CI: the engine test
        # below runs the real app and a modal CRT dialog would hang the job
        # retry: vcpkg downloads flake on runners but installs resume cleanly;
        # every attempt is tee'd so the publish step ships the REAL log
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DKOTEK_TESTS=ON -DKOTEK_TESTS_RUNTIME=ON -DKOTEK_ASSERT_STDERR_ROUTING=ON *> configure-attempt$attempt.log
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Host "configure attempt $attempt failed, retrying (vcpkg resumes)..."
          }

      - name: build
        shell: pwsh
        run: cmake --build build --config Debug --parallel *> build-output.log

      # engine-level test: boot from the repo root, run a bounded frame
      # count. Requires a working boot chain — failures here are real
      # engine bugs surfaced by CI.
      - name: run engine tests
        run: |
          & ./build/bin/Debug/kotek.exe --no_splash --kotek_frames=30 2>&1 | Tee-Object -FilePath test-run.log
          exit $LASTEXITCODE

      # job logs and artifacts need admin rights to view — push the failure
      # logs to a public ci-logs branch instead (same pattern as kotek's
      # workflows; the tee'd attempt logs + the engine run log are the
      # debuggable evidence)
      - name: publish failure logs to ci-logs branch
        if: failure()
        shell: pwsh
        run: |
          $dest = "ci-logs/${{ github.run_id }}/tests"
          New-Item -ItemType Directory -Force $dest | Out-Null
          if (Test-Path configure-attempt1.log) { Copy-Item configure-attempt*.log $dest -Force -ErrorAction SilentlyContinue }
          if (Test-Path build-output.log) { Copy-Item build-output.log $dest -Force -ErrorAction SilentlyContinue }
          if (Test-Path test-run.log) { Copy-Item test-run.log $dest -Force -ErrorAction SilentlyContinue }
          cmake -S . -B build-diag -DCMAKE_BUILD_TYPE=Debug -DKOTEK_TESTS=ON -DKOTEK_TESTS_RUNTIME=ON -DKOTEK_ASSERT_STDERR_ROUTING=ON *> "$dest/diag-configure-output.log"; $null

          # push from a SEPARATE clone: branch switching inside the job's
          # checkout proved too fragile (shallow refspecs, orphan states)
          $tmp = "$env:RUNNER_TEMP/ci-logs-push"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          $repo = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch ci-logs $repo $tmp
          if ($LASTEXITCODE -ne 0) {
            git clone --depth 1 $repo $tmp
            git -C $tmp checkout --orphan ci-logs
            git -C $tmp rm -rf --quiet .
          }
          New-Item -ItemType Directory -Force "$tmp/$dest" | Out-Null
          Copy-Item -Recurse "$dest/*" "$tmp/$dest/" -Force
          git -C $tmp config user.email "ci@zircon"
          git -C $tmp config user.name "zircon-ci"
          git -C $tmp add $dest
          git -C $tmp diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "no new logs to publish"; exit 0 }
          git -C $tmp commit --quiet -m "ci logs: tests run ${{ github.run_number }}"
          git -C $tmp push origin ci-logs

      - name: upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-log
          path: test-run.log
          retention-days: 7
